server:
  port: 5004

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: filesharing-videocodec
  data:
    mongodb:
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_WORKER_ACCESS_KEY}
  secret-key: ${MINIO_WORKER_SECRET_KEY}
  buckets:
    files: file-sharing
    hls: hls-bucket

video:
  encoding:
    ffmpeg:
      path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      timeout: 3600000
      probe-timeout: 60000
      threads-per-process: 2
      crf: 23
      preset: medium
    segment:
      duration: 6
      audio-bitrate: 128k

resilience4j:
  bulkhead:
    instances:
      ffmpeg-encoder:
        maxConcurrentCalls: 2
        maxWaitDuration: 0ms

job-runtime:
  enabled: true
  job-types: [TRANSCODE_HLS]
  bulkhead-name: ffmpeg-encoder
  workspace-dir: ${java.io.tmpdir}/encode

outbox-relay:
  enabled: true
