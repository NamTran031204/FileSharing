server:
  port: 5003

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: filesharing-imagerawproccess
  data:
    mongodb:
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    files: file-sharing
    thumbnails: thumbnail-bucket
    image-preview: image-preview-bucket

raw:
  processing:
    exiftool-path: ${EXIFTOOL_PATH:exiftool}
    command-timeout: 30s
    lock-wait: 60s

resilience4j:
  bulkhead:
    instances:
      raw-processor:
        maxConcurrentCalls: 2
        maxWaitDuration: 0ms

job-runtime:
  enabled: true
  job-types: [TRANSCODE_RAW_IMAGE]
  bulkhead-name: raw-processor
  workspace-dir: ${java.io.tmpdir}/raw-input

outbox-relay:
  enabled: true
