<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Cảnh báo liên kết tài khoản Google</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f4f4f4;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #b45309;
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
        }

        .content {
            padding: 40px 30px;
            color: #333333;
        }

        .footer {
            background-color: #f4f4f4;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>
<div style="padding: 40px 0;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" class="container" role="presentation" style="max-width: 600px;"
           width="100%">
        <tr>
            <td align="center" bgcolor="#b45309" class="header">
                <h1 style="margin: 0; font-size: 22px; font-weight: bold;">Cảnh báo bảo mật tài khoản</h1>
            </td>
        </tr>
        <tr>
            <td bgcolor="#ffffff" class="content">
                <p style="margin-top: 0;">Xin chào,</p>
                <p>Một tài khoản Google vừa được liên kết với tài khoản của bạn (<span th:text="${toEmail}">user@example.com</span>).</p>
                <p style="margin-top: 20px; color: #b45309; font-weight: bold;">
                    Nếu đây không phải là bạn, vui lòng liên hệ hỗ trợ ngay lập tức.
                </p>
            </td>
        </tr>
        <tr>
            <td align="center" bgcolor="#f4f4f4" class="footer">
                <p style="margin: 0;">&copy; 2026 File Sharing Service. Đây là email tự động, vui lòng không trả lời.</p>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
