server:
  port: 5002

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: filesharing-imagecodec
  data:
    mongodb:
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    files: file-sharing
    thumbnails: thumbnail-bucket
    image-preview: image-preview-bucket

image:
  processing:
    vips:
      path: ${VIPS_PATH:vips}
      header-path: ${VIPSHEADER_PATH:vipsheader}
      processing-timeout-seconds: 30
      max-pixels: 50000000
      # thread moi tien trinh vips; bulkhead image-processor (3) x 2 <= so core
      concurrency: 2
      allowed-loaders: [jpegload, pngload, webpload, gifload, tiffload, heifload]
    output:
      webp-quality: 82
      webp-effort: 6
      thumbnail-width: 200
      preview-max-edge: 2560

resilience4j:
  bulkhead:
    instances:
      image-processor:
        maxConcurrentCalls: 3
        maxWaitDuration: 0ms

job-runtime:
  enabled: true
  job-types: [TRANSCODE_IMAGE]
  bulkhead-name: image-processor
  workspace-dir: ${java.io.tmpdir}/vips-input

outbox-relay:
  enabled: true
