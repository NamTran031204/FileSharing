# loai node hien tren trang quan tri (WORKER duoc drain)
node:
  kind: WORKER

server:
  port: 5002

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: filesharing-imagecodec
  data:
    mongodb:
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    files: file-sharing
    thumbnails: thumbnail-bucket
    image-preview: image-preview-bucket

image:
  processing:
    vips:
      path: ${VIPS_PATH:vips}
      header-path: ${VIPSHEADER_PATH:vipsheader}

resilience4j:
  bulkhead:
    instances:
      image-processor:
        maxWaitDuration: 0ms

job-runtime:
  enabled: true
  job-types: [TRANSCODE_IMAGE]
  bulkhead-name: image-processor
  workspace-dir: ${java.io.tmpdir}/vips-input

outbox-relay:
  enabled: true
