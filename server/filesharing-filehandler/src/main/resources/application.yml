# loai node hien tren trang quan tri (WORKER duoc drain)
node:
  kind: API

server:
  port: 5000

spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: optional:file:./.env[.properties]
  application:
    name: filesharing-filehandler
  data:
    mongodb:
      uri: ${MONGO_URI}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 5
      batch-size: 32768
      linger-ms: 30
      buffer-memory: 67108864
      compression-type: lz4
      properties:
        max.block.ms: 10000
        request.timeout.ms: 20000
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      group-id: file-handler
    listener:
      ack-mode: manual
      concurrency: 1

kafka:
  topics:
    notification_email_sender: notification_email_sender
    job_result_topic: job_result_topic
  authen: ${KAFKA_AUTH:false}
  username: ${KAFKA_USER:admin}
  password: ${KAFKA_PASS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    files: file-sharing
    thumbnails: thumbnail-bucket
    image-preview: image-preview-bucket
    hls: hls-bucket
  svc-upload:
    access-key: ${MINIO_SVC_UPLOAD_ACCESS_KEY}
    secret-key: ${MINIO_SVC_UPLOAD_SECRET_KEY}
  svc-download:
    access-key: ${MINIO_SVC_DOWNLOAD_ACCESS_KEY}
    secret-key: ${MINIO_SVC_DOWNLOAD_SECRET_KEY}
