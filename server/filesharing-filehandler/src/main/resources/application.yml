server:
  port: 5000

spring:
  application:
    name: filesharing-filehandler
  data:
    mongodb:
      uri: ${MONGO_URI}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 5
      batch-size: 32768
      linger-ms: 30
      buffer-memory: 67108864
      compression-type: lz4
      properties:
        max.block.ms: 10000
        request.timeout.ms: 20000
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: latest
      group-id: file-handler
    listener:
      ack-mode: manual
      concurrency: 1

kafka:
  topics:
    notification_email_sender: notification_email_sender
    video_encode_topic: video_encode_topic
    video_encode_result_topic: video_encode_result_topic
    image_process_topic: image_process_topic
    image_process_result_topic: image_process_result_topic
  authen: ${KAFKA_AUTH:false}
  username: ${KAFKA_USER:admin}
  password: ${KAFKA_PASS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    files: file-sharing
    thumbnails: thumbnail-bucket
    image-preview: image-preview-bucket
    hls: hls-bucket
  svc-upload:
    access-key: ${MINIO_SVC_UPLOAD_ACCESS_KEY}
    secret-key: ${MINIO_SVC_UPLOAD_SECRET_KEY}
  svc-download:
    access-key: ${MINIO_SVC_DOWNLOAD_ACCESS_KEY}
    secret-key: ${MINIO_SVC_DOWNLOAD_SECRET_KEY}
#  access-key: 5UVTKA00N1U9060FMZW0
#  secret-key: ZXd4xWM3hmiTZbgGVZ+LUJG2suVh0Vr3QiPjZjn0

upload:
  max-file-size: 53687091200
  part-url-ttl: 900s
  max-threads: 6
  session-idle-ttl: 86400s
  max-sessions-per-user: 20
  verify-etag-md5: true
  gc-interval: 900s
  reconcile-interval: 86400s

application:
  security:
    jwt:
      expiration: 86400000 # 24 hours
      secret-key: ${JWT_SECRET_KEY}
      refresh-token:
        expiration: 604800000     # 7 days

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

springdoc:
  api-docs:
    enabled: true
    output-file: docs/filehandler-openapi.jsons
    path: /v3/api-docs
    resolve-schema-properties: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    filter: true
  paths-to-exclude: /api/auth/**
  packages-to-scan: org.example.filesharing.controllers
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
  writer-with-default-pretty-printer: true
  # Cấu hình để giữ nguyên tên method làm operationId
  override-with-generic-response: false
  use-management-port: false
  # Sử dụng tên method làm operationId
  operationsSorter: method
