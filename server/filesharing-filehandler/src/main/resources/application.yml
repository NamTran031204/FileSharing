application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

springdoc:
  api-docs:
    enabled: true
    output-file: docs/filehandler-openapi.jsons
    path: /v3/api-docs
    resolve-schema-properties: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    filter: true
  paths-to-exclude: /api/auth/**
  packages-to-scan: org.example.filesharing.controllers
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false
  writer-with-default-pretty-printer: true
  # Cấu hình để giữ nguyên tên method làm operationId
  override-with-generic-response: false
  use-management-port: false
  # Sử dụng tên method làm operationId
  operationsSorter: method
