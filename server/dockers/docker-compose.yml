version: '3.8'

services:
  # Sinh keyFile ben trong container roi thoat. Khong bind mount tu o Windows
  # vi Docker Desktop khong gan duoc quyen 400 + owner 999.
  mongo-keyfile:
    image: mongo:7.0
    container_name: filesharing-mongo-keyfile
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -f /keyfile-data/mongo-keyfile ]; then
          openssl rand -base64 756 > /keyfile-data/mongo-keyfile
          echo "keyfile: da sinh moi"
        else
          echo "keyfile: da co tu truoc"
        fi
        chmod 400 /keyfile-data/mongo-keyfile
        chown 999:999 /keyfile-data/mongo-keyfile
    volumes:
      - mongodb_keyfile:/keyfile-data

  mongodb:
    image: mongo:7.0
    container_name: filesharing-mongodb
    restart: unless-stopped
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    # KHONG khai --auth: image tu them khi thay MONGO_INITDB_ROOT_USERNAME.
    # PHAI giu --bind_ip_all vi override command lam mat CMD mac dinh cua image.
    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /keyfile-data/mongo-keyfile
      - --oplogSize
      - "512"
      - --bind_ip_all
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: metadata
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/keyfile-data:ro
    # ping khong can auth. Dung hostname mongodb (khong phai 127.0.0.1) de giai doan
    # init cua entrypoint - luc mongod chi bind localhost - con bao unhealthy.
    healthcheck:
      test: ["CMD", "mongosh", "--host", "mongodb:27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - filesharing-network

  # rs.initiate() mot lan, idempotent, co retry. host phai la localhost:27017 vi
  # 4 service Spring chay tren may Windows, khong chay trong Docker.
  # Chi mot lenh --eval duy nhat roi thoat.
  mongo-init:
    image: mongo:7.0
    container_name: filesharing-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          if mongosh --host mongodb:27017 \
               -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" \
               --authenticationDatabase admin --quiet --eval '
                 try {
                   rs.status();
                   print("rs0 da initiate tu truoc");
                 } catch (e) {
                   rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
                   print("rs0 initiate xong");
                 }'; then
            exit 0
          fi
          echo "mongod chua san sang, thu lai ($$i/30)"
          sleep 2
        done
        echo "LOI: rs.initiate that bai sau 30 lan thu"
        exit 1
    networks:
      - filesharing-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - kafka-network

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: minio-server
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - minio-data:/data
      - ./config:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - minio-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  mc:
    image: minio/mc:latest
    container_name: minio-mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Mount script vào container
      - ./scripts/init-bucket.sh:/scripts/init-bucket.sh:ro
      # Mount config folder để ghi access.txt
      - ./config:/config
    entrypoint: /bin/sh
    command: ["/scripts/init-bucket.sh"]
    networks:
      - minio-network

volumes:
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/minio
  mongodb_data:
  mongodb_keyfile:

networks:
  minio-network:
    driver: bridge
  filesharing-network:
    driver: bridge
  kafka-network:
    driver: bridge