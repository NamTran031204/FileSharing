    // --- Main Layout/App Component ---
    const Workspace = () => {
      // Images State
      const [images, setImages] = useState(initialMockImages);
      const [currentImgIdx, setCurrentImgIdx] = useState(0);
      const currentImage = images[currentImgIdx];

      // Annotations & Comments State
      const [annotations, setAnnotations] = useState(initialAnnotations);
      const [selectedVersion, setSelectedVersion] = useState(3);
      
      // UI States
      const [uiState, setUiState] = useState('idle'); // idle, loading_annotations, drawing, awaiting_comment, syncing, error
      const [activeTool, setActiveTool] = useState('select'); // select, rect, circle, arrow, text, pin, pan
      const [activeColor, setActiveColor] = useState('#f43f5e');
      const [strokeWidth, setStrokeWidth] = useState(4);
      const [showAnnotations, setShowAnnotations] = useState(true);

      // Viewport State
      const [zoom, setZoom] = useState(100);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [selectedShapeId, setSelectedShapeId] = useState(null);
      
      // Drawing states
      const [isDrawing, setIsDrawing] = useState(false);
      const [drawingShape, setDrawingShape] = useState(null);
      const [pendingShape, setPendingShape] = useState(null);
      
      // Popups/Modals
      const [commentPopupPos, setCommentPopupPos] = useState(null);
      const [newCommentText, setNewCommentText] = useState('');
      const [simulateError, setSimulateError] = useState(false);
      const [showCompareModal, setShowCompareModal] = useState(false);
      const [compareSliderPos, setCompareSliderPos] = useState(50);
      const [mentionQuery, setMentionQuery] = useState(null);

      // Sidebars State
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [expandedSections, setExpandedSections] = useState({
        shapes: true,
        comments: true,
        actionLog: true,
        imageInfo: true
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL'); // ALL, OPEN, RESOLVED

      // Action Logs
      const [actionLogs, setActionLogs] = useState([
        { id: 1, type: 'status', action: 'Workspace Loaded', details: 'Initialized Lumina Pro canvas', time: '5m ago' },
        { id: 2, type: 'comment', action: 'Comment loaded', details: 'V3 comments synchronized', time: '5m ago' }
      ]);

      const [history, setHistory] = useState([]);
      const [redoStack, setRedoStack] = useState([]);

      const viewportRef = useRef(null);
      const commentInputRef = useRef(null);

      // Add a log entry helper
      const addLog = (action, details = '', type = 'action') => {
        setActionLogs(prev => [
          {
            id: Date.now(),
            type,
            action,
            details,
            time: 'Just now'
          },
          ...prev
        ]);
      };

      // Review Status
      const [reviewStatus, setReviewStatus] = useState('PENDING'); // PENDING, APPROVED, REQUEST_CHANGES

      // Filtered annotations for the current version and current image
      const versionAnnotations = useMemo(() => {
        return annotations.filter(
          ann => ann.imageId === currentImage.id && ann.version === selectedVersion
        );
      }, [annotations, currentImage.id, selectedVersion]);

      // Filtered & searched comments based on filters
      const filteredAnnotations = useMemo(() => {
        return versionAnnotations.filter(ann => {
          if (!ann.comment) return false;
          
          // Status filter
          if (statusFilter === 'OPEN' && ann.comment.status !== 'OPEN') return false;
          if (statusFilter === 'RESOLVED' && ann.comment.status !== 'RESOLVED') return false;
          
          // Search filter
          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase();
            const textMatch = ann.comment.text.toLowerCase().includes(query);
            const authorMatch = ann.comment.author.toLowerCase().includes(query);
            const replyMatch = ann.comment.replies.some(r => r.text.toLowerCase().includes(query) || r.author.toLowerCase().includes(query));
            return textMatch || authorMatch || replyMatch;
          }
          
          return true;
        });
      }, [versionAnnotations, statusFilter, searchQuery]);

      // Counts
      const openCount = useMemo(() => {
        return versionAnnotations.filter(ann => ann.comment && ann.comment.status === 'OPEN').length;
      }, [versionAnnotations]);

      const resolvedCount = useMemo(() => {
        return versionAnnotations.filter(ann => ann.comment && ann.comment.status === 'RESOLVED').length;
      }, [versionAnnotations]);

      // --- Navigation handlers ---
      const handlePrevImage = () => {
        if (currentImgIdx > 0) {
          setUiState('loading_annotations');
          setTimeout(() => {
            setCurrentImgIdx(prev => prev - 1);
            setZoom(100);
            setPan({ x: 0, y: 0 });
            setSelectedShapeId(null);
            setPendingShape(null);
            setCommentPopupPos(null);
            setUiState('idle');
            addLog('Switched Image', 'Loaded previous asset in queue');
          }, 300);
        }
      };

      const handleNextImage = () => {
        if (currentImgIdx < images.length - 1) {
          setUiState('loading_annotations');
          setTimeout(() => {
            setCurrentImgIdx(prev => prev + 1);
            setZoom(100);
            setPan({ x: 0, y: 0 });
            setSelectedShapeId(null);
            setPendingShape(null);
            setCommentPopupPos(null);
            setUiState('idle');
            addLog('Switched Image', 'Loaded next asset in queue');
          }, 300);
        }
      };

      // Switch Version
      const handleVersionChange = (versionNum) => {
        setUiState('loading_annotations');
        setSelectedVersion(versionNum);
        setSelectedShapeId(null);
        setPendingShape(null);
        setCommentPopupPos(null);
        setTimeout(() => {
          setUiState('idle');
          addLog('Switched Version', `Changed to Version ${versionNum}`);
        }, 500);
      };

      // Zoom helpers
      const handleZoomIn = () => {
        setZoom(prev => Math.min(prev + 25, 400));
        addLog('Zoom In', `${zoom + 25}%`);
      };

      const handleZoomOut = () => {
        setZoom(prev => Math.max(prev - 25, 25));
        addLog('Zoom Out', `${zoom - 25}%`);
      };

      const handleZoomFit = () => {
        if (!viewportRef.current) return;
        const rect = viewportRef.current.getBoundingClientRect();
        const scaleX = (rect.width - 40) / currentImage.width;
        const scaleY = (rect.height - 40) / currentImage.height;
        const bestScale = Math.min(scaleX, scaleY, 1);
        setZoom(Math.round(bestScale * 100));
        setPan({ x: 0, y: 0 });
        addLog('Fit to Screen', `${Math.round(bestScale * 100)}% zoom`);
      };

      const handleZoomReset = () => {
        setZoom(100);
        setPan({ x: 0, y: 0 });
        addLog('Reset Zoom', 'Set to 100% scale');
      };

      // Approval Logic
      const handleApprove = () => {
        setReviewStatus('APPROVED');
        addLog('Asset Approved', 'Review status updated to APPROVED', 'status');
      };

      const handleRequestChanges = () => {
        setReviewStatus('REQUEST_CHANGES');
        addLog('Changes Requested', 'Review status updated to REQUEST_CHANGES', 'status');
      };

      // Canvas Drawing complete callback
      const handleShapeComplete = (shape, clientPos) => {
        // Position comment popup at client position
        setCommentPopupPos(clientPos);
        setNewCommentText('');
        setUiState('awaiting_comment');
      };

      // Create new annotation from pending shape
      const handlePostComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim() || !pendingShape) return;

        setUiState('syncing');

        setTimeout(() => {
          if (simulateError) {
            setUiState('error');
            addLog('Network Sync Error', 'Simulated API failure', 'error');
            return;
          }

          const newCommentId = 'c_' + Date.now();
          const newAnnId = 'ann_' + Date.now();

          const textWithMention = newCommentText;
          
          const newAnn = {
            id: newAnnId,
            imageId: currentImage.id,
            version: selectedVersion,
            type: pendingShape.type,
            x: pendingShape.x,
            y: pendingShape.y,
            width: pendingShape.width,
            height: pendingShape.height,
            radius: pendingShape.radius,
            x2: pendingShape.x2,
            y2: pendingShape.y2,
            text: pendingShape.type === 'text' ? textWithMention : undefined,
            color: pendingShape.color,
            strokeWidth: pendingShape.strokeWidth,
            comment: {
              id: newCommentId,
              author: 'Curator', // Current user
              avatar: 'C',
              time: 'Just now',
              text: textWithMention,
              status: 'OPEN',
              replies: [],
              reactions: []
            }
          };

          // Save shape
          setAnnotations(prev => [...prev, newAnn]);
          
          // Save Undo State
          setHistory(prev => [...prev, { action: 'add', annotation: newAnn }]);
          setRedoStack([]);

          setPendingShape(null);
          setCommentPopupPos(null);
          setNewCommentText('');
          setSelectedShapeId(newAnnId);
          setUiState('idle');
          
          addLog('Drawn shape', `Added ${pendingShape.type} shape with comment`, 'comment');
        }, 800);
      };

      const handleCancelComment = () => {
        setPendingShape(null);
        setCommentPopupPos(null);
        setNewCommentText('');
        setUiState('idle');
        addLog('Cancelled annotation');
      };

      // Undo/Redo logic
      const handleUndo = () => {
        if (history.length === 0) return;
        const lastAction = history[history.length - 1];
        
        if (lastAction.action === 'add') {
          // Remove shape
          setAnnotations(prev => prev.filter(ann => ann.id !== lastAction.annotation.id));
          setHistory(prev => prev.slice(0, -1));
          setRedoStack(prev => [...prev, lastAction]);
          addLog('Undo action', `Removed annotation #${lastAction.annotation.id}`);
        }
      };

      const handleRedo = () => {
        if (redoStack.length === 0) return;
        const nextAction = redoStack[redoStack.length - 1];

        if (nextAction.action === 'add') {
          // Re-add shape
          setAnnotations(prev => [...prev, nextAction.annotation]);
          setRedoStack(prev => prev.slice(0, -1));
          setHistory(prev => [...prev, nextAction]);
          addLog('Redo action', `Restored annotation #${nextAction.annotation.id}`);
        }
      };

      const handleDeleteAnnotation = (annId) => {
        const deletedAnn = annotations.find(ann => ann.id === annId);
        setAnnotations(prev => prev.filter(ann => ann.id !== annId));
        setSelectedShapeId(null);
        addLog('Deleted annotation', `Removed comment by ${deletedAnn?.comment?.author}`);
      };

      // Toggle Open/Resolved
      const handleToggleStatus = (annId) => {
        setAnnotations(prev => prev.map(ann => {
          if (ann.id === annId && ann.comment) {
            const nextStatus = ann.comment.status === 'OPEN' ? 'RESOLVED' : 'OPEN';
            addLog(`Thread ${nextStatus.toLowerCase()}`, `Comment by ${ann.comment.author}`);
            return {
              ...ann,
              comment: {
                ...ann.comment,
                status: nextStatus
              }
            };
          }
          return ann;
        }));
      };

      // Reply logic
      const [activeReplyBox, setActiveReplyBox] = useState(null);
      const [replyText, setReplyText] = useState('');

      const handleAddReply = (annId, e) => {
        e.preventDefault();
        if (!replyText.trim()) return;

        setAnnotations(prev => prev.map(ann => {
          if (ann.id === annId && ann.comment) {
            const newReply = {
              id: 'rep_' + Date.now(),
              author: 'Curator',
              avatar: 'C',
              time: 'Just now',
              text: replyText
            };
            addLog('Replied to comment', `Reply added in thread by ${ann.comment.author}`);
            return {
              ...ann,
              comment: {
                ...ann.comment,
                replies: [...ann.comment.replies, newReply]
              }
            };
          }
          return ann;
        }));

        setReplyText('');
        setActiveReplyBox(null);
      };

      // Zoom to fit shape on click
      const focusOnShape = (shape) => {
        if (!shape || !viewportRef.current) return;
        const rect = viewportRef.current.getBoundingClientRect();
        const vW = rect.width;
        const vH = rect.height;

        let sX = shape.x;
        let sY = shape.y;
        if (shape.type === 'rect') {
          sX = shape.x + shape.width / 2;
          sY = shape.y + shape.height / 2;
        } else if (shape.type === 'arrow') {
          sX = (shape.x + shape.x2) / 2;
          sY = (shape.y + shape.y2) / 2;
        } else if (shape.type === 'circle') {
          sX = shape.x;
          sY = shape.y;
        }

        const focusZoom = 120;
        setZoom(focusZoom);

        const nextPan = {
          x: Math.round(vW / 2 - (sX * focusZoom / 100)),
          y: Math.round(vH / 2 - (sY * focusZoom / 100))
        };
        setPan(nextPan);
        setSelectedShapeId(shape.id);
        addLog('Focussed on shape', `Zoomed to shape of type ${shape.type}`);
      };

      // Textarea input monitoring for @mentions
      const handleCommentChange = (e) => {
        const text = e.target.value;
        setNewCommentText(text);

        const words = text.split(/[\s\n]+/);
        const lastWord = words[words.length - 1];
        
        if (lastWord && lastWord.startsWith('@')) {
          setMentionQuery(lastWord.slice(1).toLowerCase());

          setMentionQuery(null);
        }

      const handleInsertMention = (username) => {
        const words = newCommentText.split(/\s+/);
        words[words.length - 1] = `@${username} `;
        setNewCommentText(words.join(' '));
        setMentionQuery(null);
        if (commentInputRef.current) {
          commentInputRef.current.focus();
        }
      };

      const filteredMentions = useMemo(() => {
        if (mentionQuery === null) return [];
        return mockUsers.filter(u => u.username.includes(mentionQuery) || u.name.toLowerCase().includes(mentionQuery));
      }, [mentionQuery]);

        // Layout exactly matching CommonLayout.tsx
        <div className="bg-background text-primary-dark h-screen overflow-hidden flex flex-col">

              </a>
              
              {/* Breadcrumb Nav */}
              <div className="flex items-center text-xs font-semibold text-muted-foreground tracking-wide bg-card py-1.5 px-3 rounded-lg border border-border/10 shadow-sm shadow-primary-dark/5">
                <span className="hover:text-primary-dark cursor-pointer transition-colors">PROJECTS</span>
                <span className="mx-2 text-border/70"><Icons.ChevronRight /></span>
                <span className="hover:text-primary-dark cursor-pointer transition-colors">MARKETING CAMPAIGN</span>
                <span className="mx-2 text-border/70"><Icons.ChevronRight /></span>
                <span className="text-primary-dark font-black truncate max-w-[180px]">{currentImage.name}</span>
              </div>
            </div>

            <div className="flex items-center gap-4">
              {/* Review status badge */}
              <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-widest uppercase shadow-xs border ${
                reviewStatus === 'APPROVED' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' :
                reviewStatus === 'REQUEST_CHANGES' ? 'bg-rose-100 text-rose-800 border-rose-200' :
                'bg-amber-100 text-amber-800 border-amber-200'

                {reviewStatus.replace('_', ' ')}
              </span>

              <div className="w-px h-6 bg-border/30"></div>

              {/* Notifications */}
              <button className="p-2 hover:bg-primary/10 rounded-lg transition-all text-primary active:opacity-80 scale-95" title="Notifications">
                <Icons.Bell />
              </button>

              {/* User Avatar */}
              <a href="#">
                <div className="h-8 w-8 rounded-full bg-primary flex items-center justify-center font-bold text-white text-xs ring-2 ring-white/20 hover:ring-white/40 transition-all cursor-pointer">
                  C
                </div>
              </a>
            </div>
          </nav>

          {/* ================= MAIN CONTAINER (CommonLayout main area) ================= */}
          <main className="flex flex-1 min-h-0 pt-16 overflow-hidden">

                  <Icons.Home />
                  <span>Home</span>
                </button>
                <button className="flex items-center gap-3 py-3 px-4 rounded-lg font-inter text-xs tracking-wide uppercase font-bold transition-all translate-x-1 duration-200 text-muted-foreground hover:text-primary-dark hover:bg-accent/10">
                  <Icons.Dashboard />
                  <span>Dashboard</span>

                {/* Active review workspace points to 'Projects' */}

                </button>
                <button className="flex items-center gap-3 py-3 px-4 rounded-lg font-inter text-xs tracking-wide uppercase font-bold transition-all translate-x-1 duration-200 text-muted-foreground hover:text-primary-dark hover:bg-accent/10">
                  <Icons.Help />
                  <span>Help</span>
                </button>
              </nav>

              {/* Sidebar bottom action */}
              <div className="mt-auto px-2">
                <button className="w-full py-3 bg-gradient-to-br from-primary-dark to-primary text-white rounded-lg font-bold text-sm shadow-lg shadow-primary-dark/20 hover:opacity-90 transition-opacity border-none h-auto flex items-center justify-center gap-2">
                  <Icons.Plus />
                  <span>New Project</span>
                </button>

                <div className="mt-4 pt-4 border-t border-border/30">
                  <button className="flex items-center gap-3 py-2 px-2 text-muted-foreground hover:text-destructive transition-colors w-full uppercase text-[10px] font-black tracking-wider">

                    <span>Logout</span>
                  </button>
                </div>
              </div>
            </aside>

            {/* ================= WORKSPACE CONTENT (CommonLayout right children area) ================= */}
            <section className="flex-1 flex flex-col bg-background overflow-hidden relative">
              
              {/* SUB HEADER / WORKSPACE ACTION BAR */}
              <div className="h-14 bg-card border-b border-border/20 flex items-center justify-between px-6 z-10 shrink-0">
                <div className="flex items-center gap-4">
                  {/* Prev/Next Image Navigation */}
                  <div className="flex items-center bg-background rounded-lg p-1 border border-border/30 shadow-xs">
                    <button

                      disabled={currentImgIdx === 0}
                      className="p-1 hover:bg-card rounded disabled:opacity-40 disabled:hover:bg-transparent text-primary-dark transition-all cursor-pointer" 
                      title="Previous Image"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <span className="text-xs font-black text-primary-dark px-3 min-w-[50px] text-center select-none">
                      {currentImgIdx + 1} / {images.length}
                    </span>
                    <button 
                      onClick={handleNextImage} 
                      disabled={currentImgIdx === images.length - 1}
                      className="p-1 hover:bg-card rounded disabled:opacity-40 disabled:hover:bg-transparent text-primary-dark transition-all cursor-pointer" 
                      title="Next Image"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>

                  {/* Version Selector */}
                  <div className="relative group">
                    <button className="flex items-center gap-2 px-3 py-1.5 bg-background border border-border/30 hover:border-primary rounded-lg text-xs font-bold text-primary-dark transition-all cursor-pointer">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                      <span>v{selectedVersion}</span>
                      <Icons.ChevronDown />
                    </button>
                    <div className="absolute left-0 top-full mt-1 w-44 bg-card border border-border/35 rounded-lg shadow-xl py-1 hidden group-hover:block z-30">
                      {currentImage.versions.map(v => (
                        <button

                          className={`w-full text-left px-4 py-2 text-xs font-bold hover:bg-background flex items-center justify-between ${selectedVersion === v.number ? 'text-primary font-black bg-background' : 'text-muted-foreground'}`}

                  </div>

                  {/* A/B Compare Version Button */}
                  <button

                    <span>Compare</span>

                {/* Status Decisions & Export */}
                <div className="flex items-center gap-3">
                  <button

                  <button className="p-2 hover:bg-primary/10 rounded-lg text-primary-dark transition-all cursor-pointer" title="Download Source Asset">
                    <Icons.Download />
                  </button>
                  <button className="p-2 hover:bg-primary/10 rounded-lg text-primary-dark transition-all cursor-pointer" title="More Actions">
                    <Icons.More />
                  </button>
                </div>
              </div>

              {/* REVIEW GRID WORKSPACE PANELS */}
              <div className="flex-1 flex overflow-hidden relative">
                
                {/* VIEWPORT CONTAINER */}
                <div className="flex-1 relative bg-zinc-950 flex flex-col items-center justify-center overflow-hidden">
                  
                  {/* Floating Toolbar on Canvas */}
                  <div className="absolute top-4 left-4 flex flex-col gap-1.5 bg-zinc-900/90 border border-zinc-800/80 p-1.5 rounded-2xl shadow-2xl z-10 glass-panel">

                      <span className="text-[7px] font-black mt-0.5">SELECT</span>

                    <button

                    <button

                      <span className="text-[7px] font-black mt-0.5">ARROW</span>
                    </button>
                    <button 
                      onClick={() => { setActiveTool('text'); setSelectedShapeId(null); }} 
                      className={`w-10 h-10 rounded-xl flex flex-col items-center justify-center transition-all ${activeTool === 'text' ? 'bg-primary text-white' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}
                      title="Text Note (T)"

                    <button

                    {/* Undo / Redo */}

                      <Icons.Undo />

                      <Icons.Redo />

                            className={`w-6 h-6 rounded-full border-2 transition-all hover:scale-110 ${activeColor === color ? 'border-white scale-105' : 'border-transparent'}`}
                            style={{ backgroundColor: color }}
                          ></button>

                      </div>
                    </div>

                    imageHeight={currentImage.height}

                    selectedTool={activeTool}
                    activeColor={activeColor}
                    strokeWidth={strokeWidth}
                    zoom={zoom}
                    pan={pan}
                    setPan={setPan}
                    isDrawing={isDrawing}
                    setIsDrawing={setIsDrawing}
                    drawingShape={drawingShape}
                    setDrawingShape={setDrawingShape}
                    pendingShape={pendingShape}
                    setPendingShape={setPendingShape}
                    selectedShapeId={selectedShapeId}
                    setSelectedShapeId={setSelectedShapeId}
                    showAnnotations={showAnnotations}
                    onShapeComplete={handleShapeComplete}
                    setZoom={setZoom}
                    viewportRef={viewportRef}

                    <button 
                      onClick={() => { setActiveTool('pan'); addLog('Activated Pan Tool'); }}

                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </button>
                    <div className="w-px h-5 bg-zinc-800"></div>

                    <div className="flex items-center gap-2">

                    </button>
                    <button 
                      onClick={handleZoomReset} 
                      className="px-2.5 py-1 text-[10px] font-black tracking-wider hover:bg-zinc-800 hover:text-white text-zinc-400 rounded-lg transition-all cursor-pointer"

                      100%
                    </button>
                    <div className="w-px h-5 bg-zinc-800"></div>

                    <button 
                      onClick={() => { setShowAnnotations(!showAnnotations); addLog((showAnnotations ? 'Hidden' : 'Shown') + ' annotations'); }}

                      title={showAnnotations ? "Hide Annotations" : "Show Annotations"}
                    >
                      {showAnnotations ? <Icons.Eye /> : <Icons.EyeOff />}
                    </button>
                  </div>

                      className="absolute bg-card rounded-xl shadow-2xl border border-border p-4 w-72 z-30 flex flex-col gap-3"

                        left: Math.min(window.innerWidth - 680, Math.max(100, commentPopupPos.x + 20))
                      }}
                    >
                      <div className="flex items-center justify-between border-b border-border/40 pb-2">

                        </span>
                      </div>

                        <textarea

                          value={newCommentText}
                          onChange={handleCommentChange}

                                key={u.id}

                                onClick={() => handleInsertMention(u.username)}

                                <span className="w-5 h-5 rounded-full bg-accent/20 flex items-center justify-center font-bold text-[9px] text-primary-dark">{u.avatar}</span>
                                <span>{u.name}</span>
                                <span className="text-[10px] text-muted-foreground/60">@{u.username}</span>

                          </label>
                        </div>

                        <div className="flex gap-2 mt-2">
                          <button
                            type="button"
                            onClick={handleCancelComment}
                            className="flex-1 py-1.5 bg-background hover:bg-border/20 border border-border/40 rounded-lg text-primary-dark text-xs font-bold transition-all cursor-pointer"
                          >
                            Cancel
                          </button>
                          <button
                            type="submit"
                            className="flex-1 py-1.5 bg-primary hover:bg-secondary text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition-all cursor-pointer"
                          >
                            Post
                          </button>
                        </div>
                      </form>
                    </div>

                        <svg className="animate-spin h-6 w-6 text-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span className="text-xs font-bold text-zinc-300">Synchronizing Annotation...</span>
                      </div>
                    </div>

                        </div>
                        <div>

                        <div className="flex gap-2 w-full mt-2">
                          <button 
                            onClick={() => { setUiState('awaiting_comment'); setSimulateError(false); }}

                            Cancel
                          </button>
                          <button 
                            onClick={handlePostComment}
                            className="flex-1 py-2 bg-primary hover:bg-secondary text-white rounded-xl text-xs font-bold transition-all cursor-pointer"
                          >

                          </button>
                        </div>
                      </div>
                    </div>

                    {/* SECTION: DRAWING TOOL SETTINGS */}

                      <div

                        onClick={() => setExpandedSections(prev => ({ ...prev, shapes: !prev.shapes }))}
                      >
                        <h3 className="text-xs font-black text-primary-dark uppercase tracking-wider">Markup Tools</h3>
                        <span className={`text-border transition-all ${expandedSections.shapes ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                      </div>

                      {expandedSections.shapes && (
                        <div className="flex flex-col gap-4 mt-2">
                          {/* Tool Grid buttons */}
                          <div className="grid grid-cols-2 gap-2 bg-background p-1 rounded-xl border border-border/20">
                            <button 
                              onClick={() => { setActiveTool('rect'); setSelectedShapeId(null); }}
                              className={`py-2 px-3 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${activeTool === 'rect' ? 'bg-card text-primary shadow-xs border border-border/20' : 'text-muted-foreground hover:bg-card/40'}`}
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                              <span>Rectangle</span>
                            </button>
                            <button 
                              onClick={() => { setActiveTool('circle'); setSelectedShapeId(null); }}
                              className={`py-2 px-3 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${activeTool === 'circle' ? 'bg-card text-primary shadow-xs border border-border/20' : 'text-muted-foreground hover:bg-card/40'}`}
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                              <span>Circle</span>
                            </button>
                            <button 
                              onClick={() => { setActiveTool('arrow'); setSelectedShapeId(null); }}
                              className={`py-2 px-3 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${activeTool === 'arrow' ? 'bg-card text-primary shadow-xs border border-border/20' : 'text-muted-foreground hover:bg-card/40'}`}
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                              <span>Arrow</span>
                            </button>
                            <button 
                              onClick={() => { setActiveTool('text'); setSelectedShapeId(null); }}
                              className={`py-2 px-3 rounded-lg text-xs font-bold flex items-center gap-2 transition-all cursor-pointer ${activeTool === 'text' ? 'bg-card text-primary shadow-xs border border-border/20' : 'text-muted-foreground hover:bg-card/40'}`}
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-primary"></span>
                              <span>Text Note</span>
                            </button>
                          </div>

                          {/* Width control */}
                          <div className="space-y-2">
                            <div className="flex justify-between text-[10px] font-black text-muted-foreground tracking-wider">
                              <span>STROKE SIZE</span>
                              <span>{strokeWidth}px</span>

                              type="range" 
                              min="1" 
                              max="16" 
                              value={strokeWidth} 
                              onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                              className="w-full h-1.5 bg-background rounded-full appearance-none cursor-pointer accent-primary border border-border/10"
                            />
                          </div>
                        </div>
                      )}

                          <h3 className="text-xs font-black text-primary-dark uppercase tracking-wider">Feedback</h3>

                        </div>
                        <span className={`text-border transition-all ${expandedSections.comments ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>

                                placeholder="Search comments..."

                            </div>
                            
                            <div className="flex gap-1.5 bg-background p-0.5 rounded-lg border border-border/40 text-[10px] font-bold">

                                className={`flex-1 py-1 rounded text-center transition-all cursor-pointer ${statusFilter === 'ALL' ? 'bg-card text-primary-dark shadow-xs' : 'text-muted-foreground'}`}
                              >
                                All ({versionAnnotations.length})

                              <button 
                                onClick={() => setStatusFilter('OPEN')}
                                className={`flex-1 py-1 rounded text-center transition-all cursor-pointer ${statusFilter === 'OPEN' ? 'bg-card text-emerald-850 shadow-xs font-black' : 'text-muted-foreground'}`}
                              >
                                Open ({openCount})
                              </button>
                              <button 
                                onClick={() => setStatusFilter('RESOLVED')}

                                Resolved ({resolvedCount})
                              </button>
                            </div>
                          </div>

                            {filteredAnnotations.length === 0 ? (

                                <span className="text-xs font-semibold">No comments found matching filter</span>
                              </div>

                              filteredAnnotations.map(ann => {
                                const isSelected = selectedShapeId === ann.id;

                                  <div 
                                    key={ann.id}
                                    onClick={() => focusOnShape(ann)}
                                    className={`p-3.5 rounded-xl transition-all border cursor-pointer ${

                                    {/* Header info */}
                                    <div className="flex items-start justify-between">

                                        <div className="w-6 h-6 rounded-full bg-accent/30 flex items-center justify-center font-bold text-[9px] text-primary-dark">
                                          {ann.comment.avatar}

                                        <div>
                                          <h4 className="text-xs font-bold text-primary-dark">{ann.comment.author}</h4>
                                          <span className="text-[9px] text-muted-foreground/60">{ann.comment.time}</span>
                                        </div>
                                      </div>
                                      <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border ${
                                        ann.comment.status === 'OPEN' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-background text-muted-foreground border-border/30'
                                      }`}>
                                        {ann.comment.status}
                                      </span>
                                    </div>

                                    {/* Comment text */}
                                    <p className="text-xs text-primary-dark/80 mt-2.5 leading-relaxed font-semibold">
                                      {ann.comment.text}
                                    </p>

                                    {/* Actions */}
                                    <div className="flex items-center justify-between border-t border-border/20 mt-3 pt-2">
                                      <div className="flex items-center gap-3">
                                        <button 
                                          onClick={(e) => { e.stopPropagation(); setActiveReplyBox(ann.id); }}
                                          className="text-[10px] font-bold text-primary hover:underline cursor-pointer"
                                        >
                                          Reply
                                        </button>
                                        <button 
                                          onClick={(e) => { e.stopPropagation(); handleToggleStatus(ann.id); }}
                                          className="text-[10px] font-bold text-muted-foreground hover:text-primary cursor-pointer"
                                        >
                                          {ann.comment.status === 'OPEN' ? 'Resolve' : 'Reopen'}

                                      </div>
                                      
                                      <button 
                                        onClick={(e) => { e.stopPropagation(); handleDeleteAnnotation(ann.id); }}
                                        className="text-border hover:text-destructive transition-colors cursor-pointer"
                                        title="Delete Annotation Thread"
                                      >
                                        <Icons.Trash />
                                      </button>
                                    </div>

                                    {/* Thread replies list */}
                                    {ann.comment.replies.length > 0 && (
                                      <div className="mt-2.5 pl-3 border-l-2 border-border/40 space-y-2">

                                          <div key={reply.id} className="text-[11px] text-primary-dark bg-card/60 border border-border/10 p-2 rounded shadow-2xs">
                                            <div className="flex items-center gap-1.5">
                                              <span className="font-bold text-primary-dark">{reply.author}</span>
                                              <span className="text-[8px] text-muted-foreground/60">• {reply.time}</span>
                                            </div>
                                            <p className="mt-0.5 leading-relaxed">{reply.text}</p>
                                          </div>
                                        ))}
                                      </div>
                                    )}

                                    {/* Reply form */}
                                    {activeReplyBox === ann.id && (
                                      <form 
                                        onSubmit={(e) => handleAddReply(ann.id, e)}
                                        className="mt-2.5 flex gap-1.5"
                                        onClick={(e) => e.stopPropagation()}
                                      >
                                        <input
                                          type="text"
                                          placeholder="Type reply..."
                                          value={replyText}
                                          onChange={(e) => setReplyText(e.target.value)}
                                          className="flex-1 bg-card border border-border/50 rounded px-2 py-1 text-xs outline-none focus:border-primary text-primary-dark"
                                          required
                                          autoFocus
                                        />
                                        <button 
                                          type="submit" 
                                          className="px-2.5 py-1 bg-primary text-white text-xs font-bold rounded cursor-pointer hover:bg-secondary transition-all"
                                        >
                                          Post
                                        </button>
                                      </form>
                                    )}
                                  </div>
                                );
                              })
                            )}
                          </div>
                        </div>
                      )}
                    </section>

                    {/* SECTION: ACTION LOG */}
                    <section className="border-b border-border/20 p-5 max-h-[220px] overflow-hidden flex flex-col">
                      <div

                        onClick={() => setExpandedSections(prev => ({ ...prev, actionLog: !prev.actionLog }))}
                      >
                        <h3 className="text-xs font-black text-primary-dark uppercase tracking-wider">Action Log</h3>
                        <span className={`text-border transition-all ${expandedSections.actionLog ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                      </div>

                      {expandedSections.actionLog && (
                        <div className="flex-1 overflow-y-auto custom-scrollbar mt-2 pr-1 space-y-2">
                          {actionLogs.map(log => (
                            <div key={log.id} className="text-[11px] p-2 bg-background border border-border/20 rounded-lg flex gap-2">
                              <span className="text-xs">
                                {log.type === 'status' ? '⚙️' : log.type === 'error' ? '❌' : '💬'}
                              </span>
                              <div className="flex-1">
                                <p className="font-bold text-primary-dark">{log.action}</p>
                                {log.details && <p className="text-[10px] text-muted-foreground/85">{log.details}</p>}
                              </div>
                              <span className="text-[9px] text-muted-foreground/60 whitespace-nowrap">{log.time}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </section>

                    {/* SECTION: METADATA */}
                    <section className="p-5">
                      <div 
                        className="flex items-center justify-between mb-3 cursor-pointer select-none"
                        onClick={() => setExpandedSections(prev => ({ ...prev, imageInfo: !prev.imageInfo }))}
                      >
                        <h3 className="text-xs font-black text-primary-dark uppercase tracking-wider">Image Metadata</h3>
                        <span className={`text-border transition-all ${expandedSections.imageInfo ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                      </div>

                      {expandedSections.imageInfo && (
                        <div className="grid grid-cols-2 gap-y-3 gap-x-2 mt-2 text-xs">
                          <div>
                            <span className="text-[9px] font-bold text-muted-foreground/70 uppercase tracking-wider block">FILE SIZE</span>
                            <span className="font-black text-primary-dark">{currentImage.size}</span>
                          </div>
                          <div>
                            <span className="text-[9px] font-bold text-muted-foreground/70 uppercase tracking-wider block">DIMENSIONS</span>
                            <span className="font-black text-primary-dark">{currentImage.dimensions}</span>
                          </div>
                          <div>
                            <span className="text-[9px] font-bold text-muted-foreground/70 uppercase tracking-wider block">UPLOADED</span>
                            <span className="font-black text-primary-dark">{currentImage.uploadDate}</span>
                          </div>
                          <div>
                            <span className="text-[9px] font-bold text-muted-foreground/70 uppercase tracking-wider block">UPLOADER</span>
                            <span className="font-black text-primary-dark">{currentImage.uploader}</span>
                          </div>
                        </div>
                      )}
                    </section>
                  </div>
                </aside>
              </div>
            </section>
          </main>

          {/* ================= COMPARE VISUAL MODAL OVERLAY ================= */}
          {showCompareModal && (
            <div className="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-md flex items-center justify-center p-8">
              <div className="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                
                {/* Modal Header */}
                <div className="p-4 border-b border-zinc-800 flex items-center justify-between text-white">
                  <div>
                    <h3 className="text-sm font-black tracking-wider uppercase">Visual A/B Comparison</h3>
                    <p className="text-xs text-zinc-400">Comparing Version 2 (Left) with Version 3 (Right)</p>
                  </div>
                  <button 
                    onClick={() => setShowCompareModal(false)}
                    className="px-3.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-zinc-400 hover:text-white transition-all text-xs font-bold cursor-pointer"
                  >
                    Close Comparison
                  </button>
                </div>

                {/* Split slider */}
                <div className="flex-1 relative bg-zinc-950 flex items-center justify-center overflow-hidden">
                  <div 
                    className="relative max-w-full max-h-full select-none"
                    style={{
                      width: currentImage.width,
                      height: currentImage.height
                    }}
                  >
                    <img 
                      src={currentImage.url} 
                      alt="Version 3" 
                      className="absolute inset-0 w-full h-full object-contain pointer-events-none"
                      draggable={false}
                    />
                    <div className="absolute top-4 right-4 bg-zinc-900/90 text-[10px] font-black text-accent border border-zinc-800 px-3 py-1 rounded-full z-10">
                      VERSION 3 (NEW)
                    </div>

                    <div 
                      className="absolute inset-0 overflow-hidden"
                      style={{
                        width: `${compareSliderPos}%`
                      }}
                    >
                      <img 
                        src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=1200&h=800&q=80" 
                        alt="Version 2" 
                        className="absolute inset-0 object-contain pointer-events-none"
                        style={{
                          width: currentImage.width,
                          height: currentImage.height,
                          maxWidth: 'none'
                        }}
                        draggable={false}
                      />
                      <div className="absolute top-4 left-4 bg-zinc-900/90 text-[10px] font-black text-amber-500 border border-zinc-800 px-3 py-1 rounded-full z-10">
                        VERSION 2 (OLD)
                      </div>
                    </div>

                    <div 
                      className="absolute top-0 bottom-0 w-1 bg-white cursor-ew-resize z-20 flex items-center justify-center"
                      style={{
                        left: `${compareSliderPos}%`
                      }}
                    >
                      <div className="w-8 h-8 rounded-full bg-white shadow-2xl border border-zinc-200 flex items-center justify-center text-xs font-bold text-slate-800 cursor-ew-resize -translate-x-1/2">
                        ↔
                      </div>
                    </div>

                    <input 
                      type="range"
                      min="0"
                      max="100"
                      value={compareSliderPos}
                      onChange={(e) => setCompareSliderPos(e.target.value)}
                      className="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize z-30"
                    />
                  </div>
                </div>

                <div className="p-3 bg-zinc-950 border-t border-zinc-800 text-center text-[10px] text-zinc-500 font-bold uppercase tracking-widest">
                  Drag the slider line in the viewport left or right to compare details.
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Dynamic Arrow Drawing Canvas Subcomponent ---
    const Canvas = ({
      imageUrl,
      imageWidth,
      imageHeight,
      shapes,
      selectedTool,
      activeColor,
      strokeWidth,
      zoom,
      pan,
      setPan,
      isDrawing,
      setIsDrawing,
      drawingShape,
      setDrawingShape,
      pendingShape,
      setPendingShape,
      selectedShapeId,
      setSelectedShapeId,
      showAnnotations,
      onShapeComplete,
      setZoom,
      viewportRef,
      onAction
    }) => {
      const svgRef = useRef(null);
      const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [pStart, setPStart] = useState({ x: 0, y: 0 });

      const getSVGCoords = (clientX, clientY) => {
        if (!svgRef.current) return { x: 0, y: 0 };
        const rect = svgRef.current.getBoundingClientRect();
        const x = (clientX - rect.left) * (imageWidth / rect.width);
        const y = (clientY - rect.top) * (imageHeight / rect.height);
        return { x: Math.round(x), y: Math.round(y) };
      };

      const handleMouseDown = (e) => {
        if (selectedTool === 'pan') {
          setIsDraggingCanvas(true);
          setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
          return;
        }

        if (selectedTool === 'select') {
          const target = e.target;
          const shapeId = target.getAttribute('data-shape-id');
          if (shapeId) {
            setSelectedShapeId(shapeId);
            onAction('Selected shape: ' + shapeId);
          } else {
            setSelectedShapeId(null);
          }
          return;
        }

        if (['rect', 'circle', 'arrow', 'text', 'pin'].includes(selectedTool)) {
          const coords = getSVGCoords(e.clientX, e.clientY);
          setPStart(coords);
          
          if (selectedTool === 'pin') {
            const newShape = {
              id: 'temp_' + Date.now(),
              type: 'pin',
              x: coords.x,
              y: coords.y,
              color: activeColor,
              strokeWidth: strokeWidth
            };
            setPendingShape(newShape);
            onShapeComplete(newShape, { x: e.clientX, y: e.clientY });
          } else if (selectedTool === 'text') {
            const newShape = {
              id: 'temp_' + Date.now(),
              type: 'text',
              x: coords.x,
              y: coords.y,
              text: 'Text Note', // default placeholder
              color: activeColor,
              fontSize: 16
            };
            setPendingShape(newShape);
            onShapeComplete(newShape, { x: e.clientX, y: e.clientY });
          } else {
            setIsDrawing(true);
            setDrawingShape({
              type: selectedTool,
              x: coords.x,
              y: coords.y,
              x2: coords.x,
              y2: coords.y,
              width: 0,
              height: 0,
              radius: 0,
              color: activeColor,
              strokeWidth: strokeWidth
            });
          }
        }
      };

      const handleMouseMove = (e) => {
        if (isDraggingCanvas) {
          setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
          return;
        }

        if (isDrawing && drawingShape) {
          const coords = getSVGCoords(e.clientX, e.clientY);
          let updated = { ...drawingShape };
          if (drawingShape.type === 'rect') {
            updated.x = Math.min(pStart.x, coords.x);
            updated.y = Math.min(pStart.y, coords.y);
            updated.width = Math.abs(coords.x - pStart.x);
            updated.height = Math.abs(coords.y - pStart.y);
          } else if (drawingShape.type === 'circle') {
            updated.radius = Math.round(Math.hypot(coords.x - pStart.x, coords.y - pStart.y));
          } else if (drawingShape.type === 'arrow') {
            updated.x2 = coords.x;
            updated.y2 = coords.y;
          }
          setDrawingShape(updated);
        }
      };

      const handleMouseUp = (e) => {
        if (isDraggingCanvas) {
          setIsDraggingCanvas(false);
          return;
        }

        if (isDrawing && drawingShape) {
          setIsDrawing(false);
          const size = drawingShape.type === 'rect' ? Math.max(drawingShape.width, drawingShape.height) :
                       drawingShape.type === 'circle' ? drawingShape.radius :
                       drawingShape.type === 'arrow' ? Math.hypot(drawingShape.x2 - drawingShape.x, drawingShape.y2 - drawingShape.y) : 0;
          
          if (size > 10) {
            const finalShape = {
              ...drawingShape,
              id: 'temp_' + Date.now()
            };
            setPendingShape(finalShape);
            setDrawingShape(null);
            onShapeComplete(finalShape, { x: e.clientX, y: e.clientY });
          } else {
            setDrawingShape(null);
          }
        }
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomFactor = 1.05;
        let nextZoom = e.deltaY < 0 ? zoom * zoomFactor : zoom / zoomFactor;
        nextZoom = Math.min(400, Math.max(25, Math.round(nextZoom)));
        setZoom(nextZoom);
      };

      useEffect(() => {
        const viewport = viewportRef.current;
        if (viewport) {
          viewport.addEventListener('wheel', handleWheel, { passive: false });
        }
        return () => {
          if (viewport) {
            viewport.removeEventListener('wheel', handleWheel);
          }
        };
      }, [zoom, viewportRef]);

      const uniqueColors = Array.from(new Set([...shapes.map(s => s.color), activeColor]));

      return (
        <div
          ref={viewportRef}
          className={`relative w-full h-full overflow-hidden flex items-center justify-center bg-zinc-950 select-none ${
            selectedTool === 'pan' ? (isDraggingCanvas ? 'cursor-grabbing' : 'cursor-grab') : 'cursor-default'
          }`}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
        >
          <div
            className="relative transition-transform duration-75 ease-out origin-center"
            style={{
              transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom / 100})`,
              width: imageWidth,
              height: imageHeight
            }}
          >
            <img
              src={imageUrl}
              alt="Canvas Asset"
              className="absolute inset-0 w-full h-full object-contain pointer-events-none shadow-2xl border border-zinc-800"
              draggable={false}
            />

            <svg
              ref={svgRef}
              viewBox={`0 0 ${imageWidth} ${imageHeight}`}
              className="absolute inset-0 w-full h-full cursor-crosshair fill-none"
              style={{ cursor: selectedTool === 'pan' ? 'inherit' : (selectedTool === 'select' ? 'default' : 'crosshair') }}
            >
              <defs>
                {uniqueColors.map(color => (
                  <marker
                    key={color}
                    id={`arrow-${color.replace('#', '')}`}
                    viewBox="0 0 10 10"
                    refX="6"
                    refY="5"
                    markerWidth="8"
                    markerHeight="8"
                    orient="auto-start-reverse"
                  >
                    <path d="M 0 1 L 10 5 L 0 9 z" fill={color} />
                  </marker>
                ))}
              </defs>

              {showAnnotations && shapes.map(shape => {
                const isSelected = selectedShapeId === shape.id;
                const strokeColor = isSelected ? '#a6a0ed' : shape.color;
                const strokeW = isSelected ? shape.strokeWidth + 3 : shape.strokeWidth;
                
                return (
                  <g key={shape.id}>
                    {shape.type === 'rect' && (
                      <rect
                        data-shape-id={shape.id}
                        x={shape.x}
                        y={shape.y}
                        width={shape.width}
                        height={shape.height}
                        stroke={strokeColor}
                        strokeWidth={strokeW}
                        className="transition-all hover:stroke-indigo-400 cursor-pointer"
                      />
                    )}
                    {shape.type === 'circle' && (
                      <circle
                        data-shape-id={shape.id}
                        cx={shape.x}
                        cy={shape.y}
                        r={shape.radius}
                        stroke={strokeColor}
                        strokeWidth={strokeW}
                        className="transition-all hover:stroke-indigo-400 cursor-pointer"
                      />
                    )}
                    {shape.type === 'arrow' && (
                      <line
                        data-shape-id={shape.id}
                        x1={shape.x}
                        y1={shape.y}
                        x2={shape.x2}
                        y2={shape.y2}
                        stroke={strokeColor}
                        strokeWidth={strokeW}
                        markerEnd={`url(#arrow-${shape.color.replace('#', '')})`}
                        className="transition-all hover:stroke-indigo-400 cursor-pointer"
                      />
                    )}
                    {shape.type === 'text' && (
                      <g data-shape-id={shape.id} className="cursor-pointer">
                        <rect
                          x={shape.x - 6}
                          y={shape.y - 4}
                          width={shape.text.length * 8 + 12}
                          height={24}
                          rx={4}
                          fill={shape.color}
                          className="shadow-md"
                        />
                        <text
                          x={shape.x}
                          y={shape.y + 8}
                          fill="#ffffff"
                          fontSize={11}
                          fontWeight="bold"
                          dominantBaseline="middle"
                          textAnchor="start"
                        >
                          {shape.text}
                        </text>
                      </g>
                    )}
                    {shape.type === 'pin' && (
                      <g data-shape-id={shape.id} className="cursor-pointer">
                        <circle
                          cx={shape.x}
                          cy={shape.y}
                          r={14}
                          fill={shape.color}
                          stroke="white"
                          strokeWidth={2}
                          className="drop-shadow-lg"
                        />
                        <text
                          x={shape.x}
                          y={shape.y}
                          fill="white"
                          fontSize={10}
                          textAnchor="middle"
                          dominantBaseline="central"
                        >
                          💬
                        </text>
                      </g>
                    )}
                    {isSelected && shape.type !== 'text' && shape.type !== 'pin' && (
                      <rect
                        x={(shape.type === 'rect' ? shape.x : shape.type === 'circle' ? shape.x - shape.radius : Math.min(shape.x, shape.x2)) - 4}
                        y={(shape.type === 'rect' ? shape.y : shape.type === 'circle' ? shape.y - shape.radius : Math.min(shape.y, shape.y2)) - 4}
                        width={(shape.type === 'rect' ? shape.width : shape.type === 'circle' ? shape.radius * 2 : Math.abs(shape.x2 - shape.x)) + 8}
                        height={(shape.type === 'rect' ? shape.height : shape.type === 'circle' ? shape.radius * 2 : Math.abs(shape.y2 - shape.y)) + 8}
                        fill="none"
                        stroke="#a6a0ed"
                        strokeWidth={1.5}
                        strokeDasharray="4,4"
                      />
                    )}
                  </g>
                );
              })}

              {isDrawing && drawingShape && (
                <g>
                  {drawingShape.type === 'rect' && (
                    <rect
                      x={drawingShape.x}
                      y={drawingShape.y}
                      width={drawingShape.width}
                      height={drawingShape.height}
                      stroke={activeColor}
                      strokeWidth={strokeWidth}
                      strokeDasharray="4,4"
                    />
                  )}
                  {drawingShape.type === 'circle' && (
                    <circle
                      cx={drawingShape.x}
                      cy={drawingShape.y}
                      r={drawingShape.radius}
                      stroke={activeColor}
                      strokeWidth={strokeWidth}
                      strokeDasharray="4,4"
                    />
                  )}
                  {drawingShape.type === 'arrow' && (
                    <line
                      x1={drawingShape.x}
                      y1={drawingShape.y}
                      x2={drawingShape.x2}
                      y2={drawingShape.y2}
                      stroke={activeColor}
                      strokeWidth={strokeWidth}
                      markerEnd={`url(#arrow-${activeColor.replace('#', '')})`}
                      strokeDasharray="4,4"
                    />
                  )}
                </g>
              )}

              {pendingShape && (
                <g>
                  {pendingShape.type === 'rect' && (
                    <rect
                      x={pendingShape.x}
                      y={pendingShape.y}
                      width={pendingShape.width}
                      height={pendingShape.height}
                      stroke={pendingShape.color}
                      strokeWidth={pendingShape.strokeWidth}
                      strokeDasharray="4,4"
                    />
                  )}
                  {pendingShape.type === 'circle' && (
                    <circle
                      cx={pendingShape.x}
                      cy={pendingShape.y}
                      r={pendingShape.radius}
                      stroke={pendingShape.color}
                      strokeWidth={pendingShape.strokeWidth}
                      strokeDasharray="4,4"
                    />
                  )}
                  {pendingShape.type === 'arrow' && (
                    <line
                      x1={pendingShape.x}
                      y1={pendingShape.y}
                      x2={pendingShape.x2}
                      y2={pendingShape.y2}
                      stroke={pendingShape.color}
                      strokeWidth={pendingShape.strokeWidth}
                      markerEnd={`url(#arrow-${pendingShape.color.replace('#', '')})`}
                      strokeDasharray="4,4"
                    />
                  )}
                  {pendingShape.type === 'pin' && (
                    <circle
                      cx={pendingShape.x}
                      cy={pendingShape.y}
                      r={14}
                      fill={pendingShape.color}
                      stroke="white"
                      strokeWidth={2}
                      strokeDasharray="3,3"
                    />
                  )}
                </g>
              )}
            </svg>
          </div>
        </div>
      );
    };

    // Render React Application
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<Workspace />);
  </script>
</body>
</html>
