<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup Trình Xem Ảnh - Media Review</title>
  <style>
    /* Layout and theme */
    :root {
      --bg: #C7ECF8;
      --bg-2: #96AFB8;
      --panel: #FEE0CD;
      --panel-2: #F4D3BC;
      --primary: #4A626A;
      --primary-soft: #96AFB8;
      --accent: #C4A997;
      --text: #1C242A;
      --muted: rgba(28,36,42,0.65);
      --border: rgba(74,98,106,0.22);
      --shadow: 0 12px 38px rgba(74,98,106,0.18);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Helvetica Neue", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(150,175,184,0.28), transparent 32%),
          radial-gradient(circle at 80% 0%, rgba(199,236,248,0.55), transparent 30%),
          var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #FEE0CD;
      box-shadow: 0 8px 30px rgba(74,98,106,0.25);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: var(--shadow);
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), #3c5259);
      color: #FEE0CD;
      border-color: transparent;
    }
    .btn.ghost { background: transparent; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.6fr 0.9fr;
      gap: 14px;
      padding: 14px 18px 22px;
    }
    .viewer-card, .side-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .viewer-toolbar {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }
    .toolbar-chip {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.6);
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .toolbar-chip:hover { color: var(--primary); border-color: var(--primary); }
    .toolbar-chip.active { color: #FEE0CD; background: var(--primary); border-color: var(--primary); }

    .viewer-stage {
      position: relative;
      flex: 1;
      background: rgba(255,255,255,0.55);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .image-frame {
      width: min(92%, 1180px);
      max-height: 88vh;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(254,224,205,0.8));
    }
    .image-frame img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #0b0f17;
    }
    .annotation-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .annotation-pin {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 8px rgba(196,169,151,0.28), 0 10px 25px rgba(74,98,106,0.25);
      border: 2px solid #FEE0CD;
      transform: translate(-50%, -50%);
    }
    .floating-tools {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      gap: 10px;
    }
    .floating-tools .btn {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(6px);
      border-color: var(--border);
      min-width: 110px;
      text-align: left;
    }

    .side-panel {
      min-height: 400px;
    }
    .side-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .list {
      padding: 12px 14px 6px;
      display: grid;
      gap: 10px;
      overflow-y: auto;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.7);
      display: grid;
      gap: 6px;
    }
    .card small { color: var(--muted); }
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(196,169,151,0.32);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.3px;
    }
    .note-input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.82);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 6px;
      resize: vertical;
      min-height: 64px;
    }
    .footer-actions {
      padding: 10px 14px 14px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; }
      .viewer-stage { min-height: 420px; }
      .side-panel { order: -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">MR</div>
      <div>
        <div>Media Review</div>
        <small style="color: var(--muted);">Mockup trình xem ảnh</small>
      </div>
    </div>
    <div class="controls">
      <button class="btn ghost">Quay lại</button>
      <button class="btn primary">Xuất ghi chú</button>
    </div>
  </header>

  <main>
    <section class="viewer-card">
      <div class="viewer-toolbar">
        <div class="toolbar-chip active">Xem ảnh</div>
        <div class="toolbar-chip">Annotate</div>
        <div class="toolbar-chip">So sánh</div>
        <div class="toolbar-chip">Thông tin</div>
      </div>
      <div class="viewer-stage">
        <div class="image-frame">
          <img src="https://placehold.co/1400x900/png" alt="Ảnh xem trước" />
          <div class="annotation-overlay">
            <div class="annotation-pin" style="top:32%; left:48%;"></div>
            <div class="annotation-pin" style="top:64%; left:72%;"></div>
          </div>
          <div class="floating-tools">
            <button class="btn">+ Ghi chú mới</button>
            <button class="btn">+ Hình vẽ</button>
            <button class="btn">Lưới/Guides</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="side-header">Ghi chú & Annotation</div>
      <div class="list">
        <div class="card">
          <div><span class="tag">#12</span> Vùng nền bị tối, tăng sáng 5%</div>
          <small>Time/Spot: 32% x 48% · Bởi: Mai Anh · Trạng thái: Open</small>
        </div>
        <div class="card">
          <div><span class="tag" style="background: rgba(109,211,255,0.14); color: var(--accent);">#13</span> Bo góc ảnh chính 12px</div>
          <small>Time/Spot: 64% x 72% · Bởi: Thuỳ Linh · Trạng thái: Open</small>
        </div>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>Thêm ghi chú mới</div>
            <span class="tag" style="background: rgba(255,255,255,0.08); color: var(--muted);">Draft</span>
          </div>
          <textarea class="note-input" placeholder="Nhập ghi chú..." disabled></textarea>
        </div>
      </div>
      <div class="footer-actions">
        <button class="btn ghost">Hủy</button>
        <button class="btn primary">Lưu ghi chú</button>
      </div>
    </aside>
  </main>
</body>
</html>
